# Optional local stack: Postgres + API + web.  Usage: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: cm_grievance }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cm_grievance
      JWT_SECRET: local-docker-secret-change-me
      CLIENT_URL: http://localhost:3000
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.0-flash}
    ports: ["5000:5000"]
    volumes: [uploads:/app/uploads]
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build && npm start"
    environment: { NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1 }
    volumes: ["./frontend:/app"]
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: { pgdata: {}, uploads: {} }
